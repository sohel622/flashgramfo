name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets directory
        run: |
          mkdir -p dist
          cp index.html dist/

      - name: Install and Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          rm -f capacitor.config.json capacitor.config.ts
          npx cap init "Flashgram" "com.flashgram.app" --web-dir=dist
          npx cap add android || true
          npx cap sync android

      - name: Fix Kotlin Version Conflict
        run: |
          cd android/app
          echo "" >> build.gradle
          echo "configurations.all {" >> build.gradle
          echo "    resolutionStrategy.eachDependency { details ->" >> build.gradle
          echo "        if (details.requested.group == 'org.jetbrains.kotlin') {" >> build.gradle
          echo "            details.useVersion '1.9.24'" >> build.gradle
          echo "        }" >> build.gradle
          echo "    }" >> build.gradle
          echo "}" >> build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashgram-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
