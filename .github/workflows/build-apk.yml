name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets directory
        run: |
          mkdir -p dist
          cp index.html dist/

      - name: Install and Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/browser @capacitor/app @capacitor/push-notifications
          rm -f capacitor.config.json capacitor.config.ts
          npx cap init "Flashgram" "com.flashgram.app" --web-dir=dist
          npx cap add android || true
          npx cap sync android

      - name: Add google-services.json for Firebase Cloud Messaging
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "GOOGLE_SERVICES_JSON secret is missing"; exit 1; fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          ls -l android/app/google-services.json

      - name: Add Google sign-in deep-link intent filter
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          if p.exists():
              s = p.read_text()
              if 'android:scheme="com.flashgram.app"' in s:
                  print('deep-link intent filter already present')
              else:
                  block = ('        <intent-filter>\n'
                           '            <action android:name="android.intent.action.VIEW" />\n'
                           '            <category android:name="android.intent.category.DEFAULT" />\n'
                           '            <category android:name="android.intent.category.BROWSABLE" />\n'
                           '            <data android:scheme="com.flashgram.app" />\n'
                           '        </intent-filter>\n')
                  s2, n = re.subn(r'(</intent-filter>)', r'\1\n' + block, s, count=1)
                  if n > 0:
                      p.write_text(s2)
                      print('deep-link intent filter added')
          PY

      - name: Bump AGP, Gradle, and compileSdk
        run: |
          python3 - <<'PY'
          import pathlib, re

          def patch_file(filepath, patterns):
              p = pathlib.Path(filepath)
              if not p.exists():
                  print(f"Skipping missing file: {filepath}")
                  return
              content = p.read_text()
              updated = content
              for pattern, repl in patterns:
                  updated, count = re.subn(pattern, repl, updated)
                  print(f"{filepath}: replaced {count} occurrence(s) of pattern: {pattern}")
              if updated != content:
                  p.write_text(updated)

          patch_file('android/build.gradle', [
              (r"com\.android\.tools\.build:gradle:[0-9.]+", "com.android.tools.build:gradle:8.11.1")
          ])
          patch_file('android/gradle/wrapper/gradle-wrapper.properties', [
              (r"gradle-[0-9.]+-all\.zip", "gradle-8.13-all.zip")
          ])
          patch_file('android/app/build.gradle', [
              (r"compileSdk\s+\d+", "compileSdk 36"),
              (r"compileSdkVersion\s+\d+", "compileSdkVersion 36")
          ])
          patch_file('android/variables.gradle', [
              (r"compileSdkVersion\s*=\s*\d+", "compileSdkVersion = 36")
          ])
          print('AGP / Gradle / compileSdk bump done successfully')
          PY

      - name: Apply Firebase google-services Gradle plugin
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('android/build.gradle')
          s = p.read_text()
          if 'com.google.gms:google-services' not in s:
              lines = s.splitlines(True)
              for i, line in enumerate(lines):
                  if 'com.android.tools.build:gradle:' in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      lines.insert(i + 1, indent + "classpath 'com.google.gms:google-services:4.6.0'\n")
                      break
              p.write_text(''.join(lines))
              print('google-services classpath added')
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          if 'com.google.gms.google-services' not in s:
              lines = s.splitlines(True)
              for i, line in enumerate(lines):
                  if "id 'com.android.application'" in line or ('apply plugin' in line and 'com.android.application' in line):
                      indent = line[:len(line) - len(line.lstrip())]
                      lines.insert(i + 1, indent + "id 'com.google.gms.google-services'\n")
                      break
              p.write_text(''.join(lines))
              print('google-services plugin applied')
          s = p.read_text()
          if 'firebase-bom' not in s:
              lines = s.splitlines(True)
              for i, line in enumerate(lines):
                  if line.strip().startswith('dependencies'):
                      indent = lines[i + 1][:len(lines[i + 1]) - len(lines[i + 1].lstrip())] if i + 1 < len(lines) else '    '
                      lines.insert(i + 1, indent + "implementation platform('com.google.firebase:firebase-bom:35.2.0')\n")
                      lines.insert(i + 2, indent + "implementation 'com.google.firebase:firebase-messaging'\n")
                      break
              p.write_text(''.join(lines))
              print('Firebase BoM + messaging added')
          PY

      - name: Enable multi-window on MainActivity
        # Small Window / floating window / split-screen: the activity
        # must declare android:resizeableActivity="true" and handle
        # every resize-related config change itself, otherwise Android
        # destroys and recreates the activity (and reloads the WebView,
        # losing the feed position and any unsaved caption) whenever
        # the window is resized. Capacitor generates resizeableActivity
        # as true by default for targetSdk 24+, but this makes it
        # explicit and fills in the configChanges flags the template
        # omits (density, layoutDirection).
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          m = re.search(r'<activity[^>]*android:name="\.MainActivity"[^>]*>', s)
          if not m:
              print('ERROR: MainActivity not found in AndroidManifest.xml')
              sys.exit(1)
          tag = m.group(0)
          orig_tag = tag
          required = ['orientation', 'keyboardHidden', 'keyboard', 'screenSize', 'locale', 'smallestScreenSize', 'screenLayout', 'uiMode', 'density', 'layoutDirection']
          if 'android:resizeableActivity' not in tag:
              tag = tag[:-1] + ' android:resizeableActivity="true">'
              print('added android:resizeableActivity="true"')
          else:
              print('android:resizeableActivity already present')
          cm = re.search(r'android:configChanges="([^"]*)"', tag)
          if cm:
              have = [x for x in cm.group(1).split('|') if x]
              missing = [x for x in required if x not in have]
              if missing:
                  newval = '|'.join(have + missing)
                  tag = tag[:cm.start(1)] + newval + tag[cm.end(1):]
                  print('added configChanges flags:', ','.join(missing))
              else:
                  print('configChanges already complete')
          else:
              tag = tag[:-1] + ' android:configChanges="' + '|'.join(required) + '">'
              print('added android:configChanges')
          if tag != orig_tag:
              s = s[:m.start()] + tag + s[m.end():]
              p.write_text(s)
              print('AndroidManifest patched for multi-window')
          else:
              print('AndroidManifest already multi-window ready')
          PY

      - name: Fix Kotlin Version Conflict
        run: |
          cd android/app
          echo "" >> build.gradle
          echo "configurations.all {" >> build.gradle
          echo "    resolutionStrategy.eachDependency { details ->" >> build.gradle
          echo "        if (details.requested.group == 'org.jetbrains.kotlin') {" >> build.gradle
          echo "            details.useVersion '1.9.24'" >> build.gradle
          echo "        }" >> build.gradle
          echo "    }" >> build.gradle
          echo "}" >> build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashgram-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
