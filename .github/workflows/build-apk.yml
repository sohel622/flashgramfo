name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets directory
        run: |
          mkdir -p dist
          cp index.html dist/

      - name: Install and Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/browser @capacitor/app @capacitor/push-notifications
          rm -f capacitor.config.json capacitor.config.ts
          npx cap init "Flashgram" "com.flashgram.app" --web-dir=dist
          npx cap add android || true
          npx cap sync android

      - name: Add google-services.json for Firebase Cloud Messaging
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "GOOGLE_SERVICES_JSON secret is missing"; exit 1; fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          ls -l android/app/google-services.json

      - name: Add Google sign-in deep-link intent filter
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          needle = 'android.intent.action.VIEW'
          if needle not in s:
              anchor = '</activity>'
              block = '''            <intent-filter android:autoVerify="true">
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="com.flashgram.app" android:host="google-signin" />
            </intent-filter>
'''
              s = s.replace(anchor, block + anchor, 1)
              p.write_text(s)
              print('deep-link intent filter added')
          else:
              print('deep-link intent filter already present')
          PY

      - name: Bump AGP, Gradle, and compileSdk
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('android/build.gradle')
          s = p.read_text()
          s = s.replace("com.android.tools.build:gradle:8.0.0", "com.android.tools.build:gradle:8.5.2")
          s = s.replace("com.android.tools.build:gradle:8.1.0", "com.android.tools.build:gradle:8.5.2")
          s = s.replace("com.android.tools.build:gradle:8.2.0", "com.android.tools.build:gradle:8.5.2")
          s = s.replace("com.android.tools.build:gradle:8.3.0", "com.android.tools.build:gradle:8.5.2")
          s = s.replace("com.android.tools.build:gradle:8.4.0", "com.android.tools.build:gradle:8.5.2")
          p.write_text(s)
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('compileSdk 33', 'compileSdk 34')
          s = s.replace('compileSdkVersion 33', 'compileSdkVersion 34')
          p.write_text(s)
          p = pathlib.Path('android/gradle/wrapper/gradle-wrapper.properties')
          s = p.read_text()
          s = re.sub(r'gradle-.*-bin\.zip', 'gradle-8.7-bin.zip', s)
          p.write_text(s)
          print('AGP/Gradle/compileSdk bumped')
          PY

      - name: Apply Firebase google-services Gradle plugin
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('android/build.gradle')
          s = p.read_text()
          if 'com.google.gms:google-services' not in s:
              lines = s.splitlines(True)
              for i, line in enumerate(lines):
                  if 'com.android.tools.build:gradle:' in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      lines.insert(i + 1, indent + "classpath 'com.google.gms:google-services:4.6.0'\n")
                      break
              p.write_text(''.join(lines))
              print('google-services classpath added')
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          if 'com.google.gms.google-services' not in s:
              lines = s.splitlines(True)
              for i, line in enumerate(lines):
                  if "id 'com.android.application'" in line or ('apply plugin' in line and 'com.android.application' in line):
                      indent = line[:len(line) - len(line.lstrip())]
                      lines.insert(i + 1, indent + "id 'com.google.gms.google-services'\n")
                      break
              p.write_text(''.join(lines))
              print('google-services plugin applied')
          s = p.read_text()
          if 'firebase-bom' not in s:
              lines = s.splitlines(True)
              for i, line in enumerate(lines):
                  if line.strip().startswith('dependencies'):
                      indent = lines[i + 1][:len(lines[i + 1]) - len(lines[i + 1].lstrip())] if i + 1 < len(lines) else '    '
                      lines.insert(i + 1, indent + "implementation platform('com.google.firebase:firebase-bom:35.2.0')\n")
                      lines.insert(i + 2, indent + "implementation 'com.google.firebase:firebase-messaging'\n")
                      break
              p.write_text(''.join(lines))
              print('Firebase BoM + messaging added')
          PY

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashgram-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
