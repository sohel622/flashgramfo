name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets directory
        run: |
          mkdir -p dist
          cp index.html dist/

      - name: Install and Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/browser @capacitor/app
          rm -f capacitor.config.json capacitor.config.ts
          npx cap init "Flashgram" "com.flashgram.app" --web-dir=dist
          npx cap add android || true
          npx cap sync android

      - name: Add Google sign-in deep-link intent filter
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          if p.exists():
              s = p.read_text()
              if 'android:scheme="com.flashgram.app"' in s:
                  print('deep-link intent filter already present')
              else:
                  block = ('        <intent-filter>\n'
                           '            <action android:name="android.intent.action.VIEW" />\n'
                           '            <category android:name="android.intent.category.DEFAULT" />\n'
                           '            <category android:name="android.intent.category.BROWSABLE" />\n'
                           '            <data android:scheme="com.flashgram.app" />\n'
                           '        </intent-filter>\n')
                  s2, n = re.subn(r'(</intent-filter>)', r'\1\n' + block, s, count=1)
                  if n > 0:
                      p.write_text(s2)
                      print('deep-link intent filter added')
          PY

      - name: Bump AGP, Gradle, and compileSdk
        run: |
          python3 - <<'PY'
          import pathlib, re

          def patch_file(filepath, patterns):
              p = pathlib.Path(filepath)
              if not p.exists():
                  print(f"Skipping {filepath}, not found.")
                  return
              content = p.read_text()
              updated = content
              for pattern, repl in patterns:
                  updated, count = re.subn(pattern, repl, updated)
                  print(f"{filepath}: replaced {pattern} -> {repl} ({count} matches)")
              if updated != content:
                  p.write_text(updated)

          patch_file('android/build.gradle', [
              (r"com\.android\.tools\.build:gradle:[0-9.]+", "com.android.tools.build:gradle:8.11.1")
          ])
          patch_file('android/gradle/wrapper/gradle-wrapper.properties', [
              (r"gradle-[0-9.]+-all\.zip", "gradle-8.13-all.zip")
          ])
          patch_file('android/app/build.gradle', [
              (r"compileSdk\s+\d+", "compileSdk 36"),
              (r"compileSdkVersion\s+\d+", "compileSdkVersion 36")
          ])
          patch_file('android/variables.gradle', [
              (r"compileSdkVersion\s*=\s*\d+", "compileSdkVersion = 36")
          ])
          print('AGP / Gradle / compileSdk bump done successfully')
          PY

      - name: Fix Kotlin Version Conflict
        run: |
          cd android/app
          echo "" >> build.gradle
          echo "configurations.all {" >> build.gradle
          echo "    resolutionStrategy.eachDependency { details ->" >> build.gradle
          echo "        if (details.requested.group == 'org.jetbrains.kotlin') {" >> build.gradle
          echo "            details.useVersion '1.9.24'" >> build.gradle
          echo "        }" >> build.gradle
          echo "    }" >> build.gradle
          echo "}" >> build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashgram-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
